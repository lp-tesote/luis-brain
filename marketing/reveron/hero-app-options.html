<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reverón — 20 full-app hero options</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{ --plat-a:#D6D9DE; --plat-b:#C3C7CD; --plat-c:#ADB1B9; --ink:#0C0D0F; --muted:#44484E; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;background:#9DA1A8}

  .opt{position:relative;height:860px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 5vw;overflow:hidden;border-bottom:1px solid rgba(0,0,0,.18);
    background:radial-gradient(ellipse 100vw 75vh at 50% 32%,rgba(255,255,255,.55),transparent 62%),
      linear-gradient(180deg,var(--plat-a),var(--plat-b) 52%,var(--plat-c));}
  .opt.bgdark{background:radial-gradient(ellipse 100vw 70vh at 50% 0%,rgba(150,160,175,.18),transparent 60%),linear-gradient(180deg,#15171c,#0c0d10)}
  .tag{position:absolute;top:18px;left:22px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:#3a3d42;z-index:30;background:rgba(255,255,255,.55);padding:5px 10px;border-radius:6px}
  .opt.bgdark .tag{background:rgba(255,255,255,.12);color:#cfd2d6}

  /* ——— copy ——— */
  .copy .brand{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#16181B;margin-bottom:16px}
  .copy .brand b{font-family:'Instrument Serif',serif;font-weight:400;font-size:19px;letter-spacing:0;text-transform:none}
  .copy h1{font-family:'Instrument Serif',serif;font-weight:400;line-height:1.04;letter-spacing:-.01em;font-size:clamp(2rem,3.3vw,3rem)}
  .copy .sub{margin-top:14px;font-weight:300;line-height:1.5;color:var(--muted);font-size:1.02rem;max-width:34ch}
  .copy .cta{margin-top:24px;display:inline-flex;align-items:center;gap:.5rem;font-size:.92rem;color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--ink);padding-bottom:4px}
  .copy .cta svg{width:13px;height:13px}
  .opt.bgdark .copy h1,.opt.bgdark .copy .cta{color:#F1F3F5}.opt.bgdark .copy .brand,.opt.bgdark .copy .brand b{color:#E2E5E8}
  .opt.bgdark .copy .sub{color:#9aa0a8}.opt.bgdark .copy .cta{border-color:#F1F3F5}

  /* layouts */
  .lay-above{flex-direction:column;gap:30px}.lay-above .copy{text-align:center;max-width:none}.lay-above .copy .sub{margin-left:auto;margin-right:auto}
  .lay-left{display:grid;grid-template-columns:0.72fr 1.28fr;gap:4%;width:100%;max-width:1240px;align-items:center}
  .lay-bleed .stage{position:absolute;inset:34px;z-index:5}
  .lay-bleed .copy{position:absolute;z-index:20;top:46px;left:52px;text-align:left}
  .lay-bleed .copy h1{font-size:clamp(1.6rem,2.6vw,2.2rem)}.lay-bleed .copy .sub{font-size:.92rem}
  .copy.overlay-card{background:rgba(255,255,255,.78);backdrop-filter:blur(8px);padding:24px 26px;border-radius:14px;box-shadow:0 20px 50px -24px rgba(20,24,30,.4);max-width:360px}
  .opt.bgdark .copy.overlay-card{background:rgba(18,20,25,.6);border:1px solid rgba(255,255,255,.1)}
  .lay-bottombar .stage{position:absolute;inset:0;z-index:5}
  .lay-bottombar .copy{position:absolute;z-index:20;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;
    gap:24px;padding:26px 6vw;background:linear-gradient(0deg,rgba(8,9,11,.92),transparent);color:#fff}
  .lay-bottombar .copy h1{font-size:1.7rem;color:#fff}.lay-bottombar .copy .sub{margin-top:6px;color:#c7cace}
  .lay-bottombar .copy .brand,.lay-bottombar .copy .brand b{color:#e2e5e8;margin-bottom:8px}.lay-bottombar .copy .cta{margin-top:0;color:#fff;border-color:#fff;white-space:nowrap}

  /* ——— frames ——— */
  .stage{display:flex;align-items:center;justify-content:center}
  .frame-plain .app{box-shadow:0 30px 70px -30px rgba(20,24,30,.45)}
  .frame-float .app{box-shadow:0 50px 90px -34px rgba(20,24,30,.5),0 18px 36px -22px rgba(20,24,30,.4)}
  .frame-tilt{perspective:2200px}.frame-tilt .app{transform:rotateY(-15deg) rotateX(6deg);box-shadow:60px 50px 90px -40px rgba(20,24,30,.55)}
  .frame-tilt2{perspective:2200px}.frame-tilt2 .app{transform:rotateY(13deg) rotateX(5deg);box-shadow:-60px 50px 90px -40px rgba(20,24,30,.55)}
  .browser{border-radius:14px;overflow:hidden;box-shadow:0 40px 80px -32px rgba(20,24,30,.5);border:1px solid rgba(0,0,0,.14)}
  .bbar{display:flex;align-items:center;gap:7px;padding:11px 15px;background:#e9eaed;border-bottom:1px solid #d9dbdf}
  .opt.bgdark .bbar{background:#1a1d22;border-color:#262a30}
  .bbar i{width:11px;height:11px;border-radius:50%;background:#c6c9ce;display:block}
  .bbar .url{margin-left:12px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#8a9098}
  .browser .app{border:0;border-radius:0;box-shadow:none}
  .laptop{padding:18px 18px 0;background:linear-gradient(#2a2d33,#16181c);border-radius:20px 20px 0 0;box-shadow:0 50px 90px -34px rgba(10,12,15,.6)}
  .laptop .app{border:0}
  .laptop .base{height:16px;margin:0 -40px;background:linear-gradient(#202327,#0e1013);border-radius:0 0 16px 16px;position:relative}
  .laptop .base::after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:90px;height:6px;background:#000;border-radius:0 0 8px 8px;opacity:.5}

  /* ——— THE APP ——— */
  .app{--bg:#fff;--bg2:#fbfbfc;--side:#f6f7f9;--sideink:#5c626b;--sideact:#eceff3;--ink:#0c0d0f;--ink2:#8a9098;--bd:#e8e9ec;
       --userb:#0c0d0f;--userink:#fff;--botb:#f3f4f6;--ok:#1C8A5A;--okbg:#E7F4ED;--wb:#9A6B1C;--wbg:#F6EFD9;--btn:#0c0d0f;--btnink:#fff;
       display:grid;grid-template-columns:206px 1fr 1.04fr;width:min(1180px,90vw);height:540px;border-radius:14px;overflow:hidden;
       border:1px solid var(--bd);background:var(--bg);color:var(--ink);font-size:13px}
  .app.t-dark{--bg:#101216;--bg2:#0c0d10;--side:#0a0b0d;--sideink:#7b818a;--sideact:#1c2026;--ink:#e6e8ec;--ink2:#7b818a;--bd:#23262c;
       --userb:#e6e8ec;--userink:#0c0d0f;--botb:#191c22;--okbg:#13231b;--wbg:#241d10;--btn:#e6e8ec;--btnink:#0c0d0f}
  .app.t-split{--side:#101216;--sideink:#9aa0a8;--sideact:#1f232a}
  .app.t-mono{--bg:#f6f7f9;--bg2:#eef0f2;--side:#dde0e4;--sideink:#5c626b;--sideact:#cdd1d6;--bd:#d2d5da;--botb:#e6e8ec;--ok:#3a4750;--okbg:#dfe3e7;--btn:#23262a}

  /* nav */
  .nav{background:var(--side);color:var(--sideink);padding:16px 12px;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--bd)}
  .app.t-split .nav,.app.t-dark .nav{border-right-color:transparent}
  .logo{font-family:'Instrument Serif',serif;font-size:19px;color:var(--ink);padding:2px 8px 12px}
  .app.t-split .logo{color:#fff}.app.t-dark .logo{color:#fff}
  .newc{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:12.5px;color:var(--ink);
    border:1px solid var(--bd);margin-bottom:12px;background:var(--bg)}
  .app.t-split .newc{color:#dfe2e6;border-color:#272b32;background:#171a20}.app.t-dark .newc{color:#dfe2e6;border-color:#262a30;background:#171a20}
  .navlbl{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.6;padding:6px 10px}
  .conv{padding:7px 10px;border-radius:7px;color:var(--sideink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
  .conv.on{background:var(--sideact);color:var(--ink)}
  .app.t-split .conv.on,.app.t-dark .conv.on{color:#fff}
  .navfoot{margin-top:auto;display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:12px}
  .udot{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#5b6470,#2b2e33);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10px}

  /* chat */
  .chat{display:flex;flex-direction:column;background:var(--bg2);border-right:1px solid var(--bd)}
  .chhd{padding:14px 18px;border-bottom:1px solid var(--bd);font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center}
  .chhd span{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:400;color:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
  .msgs{flex:1;padding:18px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
  .m{max-width:84%;line-height:1.5;font-size:12.5px}
  .m.u{align-self:flex-end;background:var(--userb);color:var(--userink);padding:9px 13px;border-radius:13px 13px 4px 13px}
  .m.b{align-self:flex-start;display:flex;gap:9px}
  .m.b .ba{flex:none;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#2b2e33,#0c0d0f);color:#fff;
    font-family:'Instrument Serif',serif;display:flex;align-items:center;justify-content:center;font-size:13px}
  .m.b .bt{background:var(--botb);padding:9px 13px;border-radius:13px 13px 13px 4px;color:var(--ink)}
  .composer{margin:14px;display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:11px;padding:9px 12px;background:var(--bg)}
  .composer input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:12.5px;color:var(--ink)}
  .composer input::placeholder{color:var(--ink2)}
  .composer .send{width:26px;height:26px;border-radius:7px;background:var(--btn);color:var(--btnink);border:0;font-size:13px;display:flex;align-items:center;justify-content:center}

  /* results */
  .res{display:flex;flex-direction:column;background:var(--bg)}
  .reshd{padding:14px 18px;border-bottom:1px solid var(--bd);font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center}
  .reshd .ct{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:var(--ink2)}
  .rrow{display:grid;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--bd)}
  .rrow .d{font-weight:500}.rrow .s{font-size:11.5px;color:var(--ink2)}
  .amt{font-family:'JetBrains Mono',monospace;font-size:12px;text-align:right}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:500;white-space:nowrap}
  .chip.ok{background:var(--okbg);color:var(--ok)}.chip.w{background:var(--wbg);color:var(--wb)}
  .cat{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--botb);font-size:11px;color:var(--ink2)}
  .ap{padding:6px 12px;border-radius:8px;background:var(--btn);color:var(--btnink);font-size:11.5px;font-weight:500;border:0;white-space:nowrap}
  .ap.g{background:transparent;color:var(--ink);border:1px solid var(--bd)}
  .resfoot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--bg2);border-top:1px solid var(--bd)}
  .resfoot .lab{font-size:11.5px;color:var(--ink2)}
  .allbtn{padding:8px 15px;border-radius:9px;background:var(--btn);color:var(--btnink);font-size:12px;font-weight:500;border:0}
  .bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding:22px 22px 14px}
  .bars .bar{flex:1;background:linear-gradient(180deg,#3a4750,#0c0d0f);border-radius:5px 5px 0 0;opacity:.85}
  .app.t-dark .bars .bar{background:linear-gradient(180deg,#aeb4bd,#5c626b)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const HEAD="Deja de operar tus finanzas. Dirígelas.";
const SUB="Reverón hace el trabajo. Tú solo apruebas.";
const CTA=`<a class="cta">Solicitar acceso <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>`;
const BRAND=`<div class="brand"><b>Reverón</b> &nbsp;· por Tesote&nbsp;AI</div>`;
function copy(kind){
  if(kind==="none")return"";
  if(kind==="overlay")return`<div class="copy overlay-card">${BRAND}<h1>${HEAD}</h1><p class="sub">${SUB}</p>${CTA}</div>`;
  if(kind==="bottombar")return`<div class="copy"><div><div>${BRAND}<h1>${HEAD}</h1></div><p class="sub">${SUB}</p></div>${CTA}</div>`;
  return`<div class="copy">${BRAND}<h1>${HEAD}</h1><p class="sub">${SUB}</p>${CTA}</div>`;
}
const CONVS=["Flujo de caja · mayo","Conciliación de mayo","Facturas por cobrar","Pagos a proveedores","Saldos bancarios","Gastos por categoría","Posición diaria","Reporte trimestral"];
function nav(){
  return `<div class="nav"><div class="logo">Reverón</div>
    <div class="newc">＋ Nueva conversación</div>
    <div class="navlbl">Conversaciones</div>
    ${CONVS.map((c,i)=>`<div class="conv${i===0?' on':''}">${c}</div>`).join("")}
    <div class="navfoot"><span class="udot">L</span> Luis · Tesote</div></div>`;
}
function chat(){
  return `<div class="chat">
    <div class="chhd">Flujo de caja · mayo <span>por Tesote AI</span></div>
    <div class="msgs">
      <div class="m u">Categoriza y concilia los movimientos de mayo.</div>
      <div class="m b"><span class="ba">R</span><div class="bt">Listo. Categoricé 142 transacciones y concilié 38 movimientos, sin errores. Te dejo todo a la derecha para tu aprobación.</div></div>
      <div class="m u">Perfecto. Arma también el reporte de flujo de caja.</div>
      <div class="m b"><span class="ba">R</span><div class="bt">Hecho. El reporte ya está en el panel, listo para publicar.</div></div>
    </div>
    <div class="composer"><input placeholder="Pregúntale a Reverón…"/><button class="send">↑</button></div></div>`;
}
function row(cols,cells){return `<div class="rrow" style="grid-template-columns:${cols}">${cells}</div>`;}
function rightActions(){
  return `<div class="res"><div class="reshd">Listo para aprobar <span class="ct">5 pendientes</span></div>
    ${row("1fr auto auto",`<div><div class="d">Conciliar 38 movimientos</div><div class="s">Banco ↔ libro</div></div><span class="chip ok">Listo</span><button class="ap">Aprobar</button>`)}
    ${row("1fr auto auto",`<div><div class="d">Categorizar 142 transacciones</div><div class="s">Confianza 98%</div></div><span class="chip ok">Listo</span><button class="ap">Aprobar</button>`)}
    ${row("1fr auto auto",`<div><div class="d">Programar pago a 5 proveedores</div><div class="s">$23.140</div></div><span class="chip w">Revisar</span><button class="ap g">Ver</button>`)}
    ${row("1fr auto auto",`<div><div class="d">Reporte de flujo de caja</div><div class="s">PDF + Excel</div></div><span class="chip ok">Listo</span><button class="ap">Aprobar</button>`)}
    <div class="resfoot"><span class="lab">Aprobar todo lo listo</span><button class="allbtn">Aprobar 3 →</button></div></div>`;
}
function rightReport(){
  return `<div class="res"><div class="reshd">Flujo de caja · mayo 2026 <span class="ct">listo</span></div>
    ${row("1fr auto",`<div class="d" style="color:var(--ok)">Total ingresos</div><span class="amt" style="color:var(--ok)">$76.336</span>`)}
    ${row("1fr auto",`<div class="d">Total egresos</div><span class="amt">$28.423</span>`)}
    ${row("1fr auto",`<div class="d">Internal transfers</div><span class="amt">$31.000</span>`)}
    ${row("1fr auto",`<div class="d" style="font-weight:600">Flujo neto</div><span class="amt" style="font-weight:600">$47.913</span>`)}
    <div class="resfoot"><span class="lab">Generado en 3s · 23 categorías</span><button class="allbtn">Aprobar y publicar →</button></div></div>`;
}
function rightCategories(){
  return `<div class="res"><div class="reshd">Categorías propuestas <span class="ct">142 tx</span></div>
    ${row("1.2fr .7fr 1fr auto",`<div class="d">Proveedora del Lago</div><span class="amt">$4.820</span><span class="cat">Inventario</span><span class="chip ok">98%</span>`)}
    ${row("1.2fr .7fr 1fr auto",`<div class="d">Servicios Andina</div><span class="amt">$1.310</span><span class="cat">Servicios</span><span class="chip ok">99%</span>`)}
    ${row("1.2fr .7fr 1fr auto",`<div class="d">Nómina quincena</div><span class="amt">$18.900</span><span class="cat">Payroll</span><span class="chip ok">100%</span>`)}
    ${row("1.2fr .7fr 1fr auto",`<div class="d">Inversiones Caribe</div><span class="amt">$2.450</span><span class="cat">Software</span><span class="chip w">86%</span>`)}
    <div class="resfoot"><span class="lab">140 con alta confianza</span><button class="allbtn">Aprobar todo →</button></div></div>`;
}
function rightPayments(){
  return `<div class="res"><div class="reshd">Pagos listos <span class="ct">$27.490</span></div>
    ${row("1.3fr .8fr .6fr auto",`<div class="d">Proveedora del Lago</div><span class="amt">$4.820</span><span class="s">Hoy</span><button class="ap">Aprobar</button>`)}
    ${row("1.3fr .8fr .6fr auto",`<div class="d">Servicios Andina</div><span class="amt">$1.310</span><span class="s">16 jun</span><button class="ap">Aprobar</button>`)}
    ${row("1.3fr .8fr .6fr auto",`<div class="d">Nómina quincena</div><span class="amt">$18.900</span><span class="s">Hoy</span><button class="ap">Aprobar</button>`)}
    ${row("1.3fr .8fr .6fr auto",`<div class="d">Molten Web</div><span class="amt">$2.460</span><span class="s">18 jun</span><button class="ap">Aprobar</button>`)}
    <div class="resfoot"><span class="lab">4 beneficiarios</span><button class="allbtn">Aprobar lote →</button></div></div>`;
}
function rightRecon(){
  return `<div class="res"><div class="reshd">Coincidencias <span class="ct">38 de 38</span></div>
    ${row("1fr auto 1fr auto",`<div class="d">Banco · $4.820</div><span class="amt" style="color:var(--ink2)">↔</span><div class="s" style="text-align:right">Factura #1042</div><span class="chip ok">Match</span>`)}
    ${row("1fr auto 1fr auto",`<div class="d">Banco · $1.310</div><span class="amt" style="color:var(--ink2)">↔</span><div class="s" style="text-align:right">Factura #1043</div><span class="chip ok">Match</span>`)}
    ${row("1fr auto 1fr auto",`<div class="d">Banco · $960</div><span class="amt" style="color:var(--ink2)">↔</span><div class="s" style="text-align:right">Recibo #88</div><span class="chip ok">Match</span>`)}
    ${row("1fr auto 1fr auto",`<div class="d">Banco · $18.900</div><span class="amt" style="color:var(--ink2)">↔</span><div class="s" style="text-align:right">Nómina 05</div><span class="chip ok">Match</span>`)}
    <div class="resfoot"><span class="lab">100% conciliado</span><button class="allbtn">Aprobar conciliación →</button></div></div>`;
}
function rightChart(){
  const h=[60,90,45,75,110,80];
  return `<div class="res"><div class="reshd">Gastos por categoría <span class="ct">may 2026</span></div>
    <div class="bars">${h.map(v=>`<div class="bar" style="height:${v}px"></div>`).join("")}</div>
    ${row("1fr auto",`<div class="s">Payroll · Software · Marketing · Bancos · Oficina · Otros</div><span class="amt">$28.4k</span>`)}
    <div class="resfoot"><span class="lab">Análisis listo</span><button class="allbtn">Aprobar reporte →</button></div></div>`;
}
function rightDigest(){
  return `<div class="res"><div class="reshd">Tu caja hoy · 7:00 a.m. <span class="ct">14 jun</span></div>
    <div class="rrow" style="grid-template-columns:1fr">Amaneciste con <b>&nbsp;$312.480&nbsp;</b> en 6 bancos. Todo en orden, salvo dos cosas:</div>
    ${row("1fr auto auto",`<div class="d">Banco operativo bajo umbral</div><span class="chip w">Atención</span><button class="ap g">Ver</button>`)}
    ${row("1fr auto auto",`<div class="d">3 facturas vencen hoy</div><span class="chip w">Acción</span><button class="ap">Pagar</button>`)}
    <div class="resfoot"><span class="lab">Resumen enviado a tu Slack</span><button class="allbtn">Revisar →</button></div></div>`;
}
const RIGHT={actions:rightActions,report:rightReport,categories:rightCategories,payments:rightPayments,recon:rightRecon,chart:rightChart,digest:rightDigest};
function app(theme,right){return `<div class="app t-${theme}">${nav()}${chat()}${RIGHT[right]()}</div>`;}

function frameApp(frame,theme,right){
  const a=app(theme,right);
  if(frame==="browser")return `<div class="browser"><div class="bbar"><i></i><i></i><i></i><span class="url">reveron.ai/app</span></div>${a}</div>`;
  if(frame==="laptop")return `<div class="laptop">${a}<div class="base"></div></div>`;
  return a;
}
